# FlashORM — ScyllaDB/Cassandra Drivers
#   Go:     "apache/cassandra-gocql-driver/v2"
#   JS:     "cassandra-driver"
#   Python: "scylla-driver" (sync) | "cassandra-driver" (async)
# Add driver = "<name>" inside the [gen.*] block below.
version = "2"
schema_dir = "db/scylla/schema/"
queries = "db/scylla/queries/"
migrations_path = "db/scylla/migrations"
export_path = "db/scylla/export"

[database]
provider = "scylla"
url_env = "DATABASE_URL"

[gen.go]
enabled = true
out = "gen/scylladb"
driver = "gocql"