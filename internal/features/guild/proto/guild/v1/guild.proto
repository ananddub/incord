syntax = "proto3";

package guild.v1;

option go_package = "github.com/ananddub/ndiscord_backend/gen/guild/v1;guildv1";

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

enum Permission {
  PERMISSION_UNSPECIFIED = 0;

  PERMISSION_VIEW_CHANNELS = 1;
  PERMISSION_SEND_MESSAGES = 2;
  PERMISSION_MANAGE_MESSAGES = 3;
  PERMISSION_MANAGE_CHANNELS = 4;
  PERMISSION_MANAGE_GUILD = 5;
  PERMISSION_KICK_MEMBERS = 6;
  PERMISSION_BAN_MEMBERS = 7;
  PERMISSION_MANAGE_ROLES = 8;
  PERMISSION_MANAGE_INVITES = 9;
  PERMISSION_ADD_REACTIONS = 10;
  PERMISSION_CONNECT = 11;
  PERMISSION_SPEAK = 12;
  PERMISSION_STREAM = 13;
  PERMISSION_MUTE_MEMBERS = 14;
  PERMISSION_DEAFEN_MEMBERS = 15;
  PERMISSION_MENTION_EVERYONE = 16;
  PERMISSION_MANAGE_EMOJIS = 17; 
  PERMISSION_MANAGE_WEBHOOKS = 18;
  PERMISSION_ADMINISTRATOR = 19;

  // Guild-wide additions
  PERMISSION_VIEW_AUDIT_LOG = 20;
  PERMISSION_VIEW_GUILD_INSIGHTS = 21;
  PERMISSION_MANAGE_NICKNAMES = 22;
  PERMISSION_CHANGE_NICKNAME = 23;
  PERMISSION_CREATE_GUILD_EXPRESSIONS = 24;
  PERMISSION_MODERATE_MEMBERS = 25; // timeout
  PERMISSION_VIEW_CREATOR_MONETIZATION_ANALYTICS = 26;

  // Channel / voice / text additions
  PERMISSION_SEND_TTS_MESSAGES = 27;
  PERMISSION_EMBED_LINKS = 28;
  PERMISSION_ATTACH_FILES = 29;
  PERMISSION_READ_MESSAGE_HISTORY = 30;
  PERMISSION_USE_EXTERNAL_EMOJIS = 31;
  PERMISSION_USE_EXTERNAL_STICKERS = 32;
  PERMISSION_USE_EXTERNAL_SOUNDS = 33;
  PERMISSION_USE_EXTERNAL_APPS = 34;
  PERMISSION_PRIORITY_SPEAKER = 35;
  PERMISSION_MOVE_MEMBERS = 36;
  PERMISSION_USE_VAD = 37;
  PERMISSION_REQUEST_TO_SPEAK = 38;
  PERMISSION_USE_SOUNDBOARD = 39;
  PERMISSION_USE_EMBEDDED_ACTIVITIES = 40;
  PERMISSION_SEND_VOICE_MESSAGES = 41;
  PERMISSION_SEND_POLLS = 42;
  PERMISSION_PIN_MESSAGES = 43;
  PERMISSION_BYPASS_SLOWMODE = 44;

  // Threads + events
  PERMISSION_CREATE_PUBLIC_THREADS = 45;
  PERMISSION_CREATE_PRIVATE_THREADS = 46;
  PERMISSION_SEND_MESSAGES_IN_THREADS = 47;
  PERMISSION_MANAGE_THREADS = 48;
  PERMISSION_CREATE_EVENTS = 49;
  PERMISSION_MANAGE_EVENTS = 50;
}

service GuildService {
  rpc CreateGuild(CreateGuildRequest) returns (CreateGuildResponse);
  rpc GetGuild(GetGuildRequest) returns (GetGuildResponse);
  rpc UpdateGuild(UpdateGuildRequest) returns (UpdateGuildResponse);
  rpc UploadGuildIcon(UploadGuildIconRequest) returns (UploadGuildIconResponse);
  rpc UploadGuildBanner(UploadGuildBannerRequest) returns (UploadGuildBannerResponse);
  rpc DeleteGuild(DeleteGuildRequest) returns (DeleteGuildResponse);
  rpc ListUserGuilds(ListUserGuildsRequest) returns (ListUserGuildsResponse);
  rpc PreviewInvite(PreviewInviteRequest) returns (PreviewInviteResponse);
  rpc JoinGuild(JoinGuildRequest) returns (JoinGuildResponse);
  rpc LeaveGuild(LeaveGuildRequest) returns (LeaveGuildResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc KickMember(KickMemberRequest) returns (KickMemberResponse);
  rpc BanMember(BanMemberRequest) returns (BanMemberResponse);
  rpc UnbanMember(UnbanMemberRequest) returns (UnbanMemberResponse);
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
  rpc RemoveRole(RemoveRoleRequest) returns (RemoveRoleResponse);

  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);

  rpc GrantPermission(GrantPermissionRequest) returns (GrantPermissionResponse);
  rpc RevokePermission(RevokePermissionRequest) returns (RevokePermissionResponse);
  rpc GetUserPermissions(GetUserPermissionsRequest) returns (GetUserPermissionsResponse);

  rpc GrantRolePermission(GrantRolePermissionRequest) returns (GrantRolePermissionResponse);
  rpc RevokeRolePermission(RevokeRolePermissionRequest) returns (RevokeRolePermissionResponse);

}

message Guild {
  string id = 1;
  string name = 2;
  string description = 3;
  string icon_url = 4;
  string owner_id = 5;
  int32 member_count = 6;
  google.protobuf.Timestamp created_at = 7;
  string banner_url = 8;
}

message GuildMember {
  string user_id = 1;
  string guild_id = 2;
  string nickname = 3;
  repeated string role_ids = 4;
  google.protobuf.Timestamp joined_at = 5;
}

message Role {
  string id = 1;
  string guild_id = 2;
  string name = 3;
  string color = 4;
  int32 position = 5;
  google.protobuf.Timestamp created_at = 6;
}

message Invite {
  string code = 1;
  string guild_id = 2;
  string channel_id = 3;
  string creator_id = 4;
  int32 max_uses = 5;
  int32 uses = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
  string url = 9;
}

message CreateGuildRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 2, max_len: 100}];
  string description = 2 [(buf.validate.field).string = {max_len: 1000}];
  string icon_url = 3 [(buf.validate.field).string = {max_len: 2048}];
}

message CreateGuildResponse {
  Guild guild = 1;
}

message GetGuildRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetGuildResponse {
  Guild guild = 1;
}

message UpdateGuildRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  optional string name = 2 [(buf.validate.field).string = {min_len: 2, max_len: 100}];
  optional string description = 3 [(buf.validate.field).string = {max_len: 1000}];
  optional string icon_url = 4 [(buf.validate.field).string = {max_len: 2048}];
  optional string banner_url = 5 [(buf.validate.field).string = {max_len: 2048}];
}

message UpdateGuildResponse {
  Guild guild = 1;
}

message UploadGuildIconRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string filename = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  string content_type = 3 [(buf.validate.field).string = {in: ["image/jpeg", "image/png", "image/gif", "image/webp"]}];
  bytes data = 4 [(buf.validate.field).bytes = {min_len: 1, max_len: 5242880}];
}

message UploadGuildIconResponse {
  string icon_url = 1;
  Guild guild = 2;
}

message UploadGuildBannerRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string filename = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  string content_type = 3 [(buf.validate.field).string = {in: ["image/jpeg", "image/png", "image/gif", "image/webp"]}];
  bytes data = 4 [(buf.validate.field).bytes = {min_len: 1, max_len: 10485760}];
}

message UploadGuildBannerResponse {
  string banner_url = 1;
  Guild guild = 2;
}

message DeleteGuildRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteGuildResponse {}

message ListUserGuildsRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListUserGuildsResponse {
  repeated Guild guilds = 1;
}

message JoinGuildRequest {
  string invite_code = 1 [(buf.validate.field).string = {min_len: 4, max_len: 32}];
}

message InviteChannelInfo {
  string id = 1;
  string name = 2;
  int32 type = 3;
  string topic = 4;
  int32 position = 5;
  string parent_id = 6;
}

message JoinGuildResponse {
  Guild guild = 1;
  repeated InviteChannelInfo channels = 2;
  int32 member_count = 3;
}

message PreviewInviteRequest {
  string invite_code = 1 [(buf.validate.field).string = {min_len: 4, max_len: 32}];
}

message InvitePreview {
  string code = 1;
  string guild_id = 2;
  string guild_name = 3;
  string guild_icon_url = 4;
  string description = 5;
  int32 member_count = 6;
  int32 channel_count = 7;
  string inviter_username = 8;
  int32 max_uses = 9;
  int32 uses = 10;
  google.protobuf.Timestamp expires_at = 11;
  bool already_member = 12;
  string url = 13;
}

message PreviewInviteResponse {
  InvitePreview preview = 1;
}

message LeaveGuildRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
}

message LeaveGuildResponse {}

message ListMembersRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  int32 limit = 2 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
  string after = 3 [(buf.validate.field).string = {max_len: 128}];
}

message ListMembersResponse {
  repeated GuildMember members = 1;
}

message KickMemberRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

message KickMemberResponse {}

message BanMemberRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  string reason = 3 [(buf.validate.field).string = {max_len: 500}];
}

message BanMemberResponse {}

message UnbanMemberRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

message UnbanMemberResponse {}

message CreateInviteRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string channel_id = 2 [(buf.validate.field).string.uuid = true];
  int32 max_uses = 3 [(buf.validate.field).int32.gte = 0];
  int32 max_age_seconds = 4 [(buf.validate.field).int32.gte = 0];
}

message CreateInviteResponse {
  Invite invite = 1;
}

message CreateRoleRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  string color = 3 [(buf.validate.field).string = {max_len: 16}];
}

message CreateRoleResponse {
  Role role = 1;
}

message UpdateRoleRequest {
  string role_id = 1 [(buf.validate.field).string.uuid = true];
  string guild_id = 2 [(buf.validate.field).string.uuid = true];
  optional string name = 3 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  optional string color = 4 [(buf.validate.field).string = {max_len: 16}];
  optional int32 position = 5 [(buf.validate.field).int32.gte = 0];
}

message UpdateRoleResponse {
  Role role = 1;
}

message DeleteRoleRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string role_id = 2 [(buf.validate.field).string.uuid = true];
}

message DeleteRoleResponse {}

message AssignRoleRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  string role_id = 3 [(buf.validate.field).string.uuid = true];
}

message AssignRoleResponse {}

message RemoveRoleRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  string role_id = 3 [(buf.validate.field).string.uuid = true];
}

message RemoveRoleResponse {}

message GrantPermissionRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  Permission permission = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

message GrantPermissionResponse {}

message RevokePermissionRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  Permission permission = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

message RevokePermissionResponse {}

message GetUserPermissionsRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

message GetUserPermissionsResponse {
  repeated Permission permissions = 1;
}

message GrantRolePermissionRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string role_id = 2 [(buf.validate.field).string.uuid = true];
  Permission permission = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

message GrantRolePermissionResponse {}

message RevokeRolePermissionRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string role_id = 2 [(buf.validate.field).string.uuid = true];
  Permission permission = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

message RevokeRolePermissionResponse {}

message TransferOwnershipRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string new_owner_id = 2 [(buf.validate.field).string.uuid = true];
}

message TransferOwnershipResponse {
  Guild guild = 1;
}
