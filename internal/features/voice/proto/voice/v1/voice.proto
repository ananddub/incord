syntax = "proto3";

package voice.v1;

option go_package = "github.com/ananddub/ndiscord_backend/gen/voice/v1;voicev1";

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

// VoiceService issues LiveKit access tokens so clients can connect directly
// to the LiveKit SFU over WebRTC. The backend itself never handles media —
// it only handles auth, room metadata, and participant bookkeeping.
service VoiceService {
  // JoinChannel returns a LiveKit URL + short-lived JWT. The client is
  // expected to feed these into a LiveKit client SDK (web/iOS/Android/Flutter)
  // and let it negotiate DTLS-SRTP/WebRTC directly with the SFU.
  rpc JoinChannel(JoinChannelRequest) returns (JoinChannelResponse);
  rpc LeaveChannel(LeaveChannelRequest) returns (LeaveChannelResponse);
  rpc GetChannelParticipants(GetChannelParticipantsRequest) returns (GetChannelParticipantsResponse);
}

message JoinChannelRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string channel_id = 2 [(buf.validate.field).string.uuid = true];
}

message JoinChannelResponse {
  // WebSocket URL of the LiveKit SFU (e.g. "ws://192.168.1.2:7880").
  string url = 1;
  // Short-lived JWT access token — pass into LiveKit client SDK.
  string token = 2;
  // Room name (one LiveKit room per voice channel).
  string room = 3;
  // Seconds until the token expires.
  int32 expires_in = 4;
}

message LeaveChannelRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string channel_id = 2 [(buf.validate.field).string.uuid = true];
}

message LeaveChannelResponse {}

message VoiceParticipant {
  string user_id = 1;
  // LiveKit participant identity (== user_id for us).
  string identity = 2;
  // LiveKit participant SID.
  string sid = 3;
  string name = 4;
  google.protobuf.Timestamp joined_at = 5;
}

message GetChannelParticipantsRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetChannelParticipantsResponse {
  repeated VoiceParticipant participants = 1;
}

