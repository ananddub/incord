syntax = "proto3";

package voice.v1;

option go_package = "github.com/ananddub/ndiscord_backend/gen/voice/v1;voicev1";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "buf/validate/validate.proto";

// URL conventions:
//   /v1/channels/{channel_id}/voice/*   guild voice channel ops
//   /v1/channels/{channel_id}/calls/*   DM / group-DM calls
//   /v1/channels/{channel_id}/voice/me/{flag}  self-state toggles (PUT=on, DELETE=off)
//   /v1/channels/{channel_id}/voice/participants/{user_id}/{flag}  moderator ops
service VoiceService {
  rpc JoinChannel(JoinChannelRequest) returns (JoinChannelResponse) {
    option (google.api.http) = { post: "/v1/channels/{channel_id}/voice/join" body: "*" };
  }
  rpc LeaveChannel(LeaveChannelRequest) returns (LeaveChannelResponse) {
    option (google.api.http) = { delete: "/v1/channels/{channel_id}/voice/me" };
  }
  rpc GetChannelParticipants(GetChannelParticipantsRequest) returns (GetChannelParticipantsResponse) {
    option (google.api.http) = { get: "/v1/channels/{channel_id}/voice/participants" };
  }

  // DM / group-DM calls. StartDMCall is the caller-initiated action;
  // JoinDMCall is the callee accepting. Both return a LiveKit token.
  rpc StartDMCall(StartDMCallRequest) returns (StartDMCallResponse) {
    option (google.api.http) = { post: "/v1/channels/{channel_id}/calls" body: "*" };
  }
  rpc JoinDMCall(JoinDMCallRequest) returns (JoinDMCallResponse) {
    option (google.api.http) = { post: "/v1/channels/{channel_id}/calls/join" body: "*" };
  }
  rpc RejectDMCall(RejectDMCallRequest) returns (RejectDMCallResponse) {
    option (google.api.http) = { post: "/v1/channels/{channel_id}/calls/reject" body: "*" };
  }
  rpc LeaveDMCall(LeaveDMCallRequest) returns (LeaveDMCallResponse) {
    option (google.api.http) = { delete: "/v1/channels/{channel_id}/calls/me" };
  }

  // Self-state toggles. PUT = flag on (mute/deaf/video/screen), DELETE = off.
  // Returns updated participant list so callers can refresh UI in one round trip.
  rpc Mute(VoiceChannelRequest) returns (VoiceParticipantsResponse) {
    option (google.api.http) = { put: "/v1/channels/{channel_id}/voice/me/mute" body: "*" };
  }
  rpc Unmute(VoiceChannelRequest) returns (VoiceParticipantsResponse) {
    option (google.api.http) = { delete: "/v1/channels/{channel_id}/voice/me/mute" };
  }
  rpc Deafen(VoiceChannelRequest) returns (VoiceParticipantsResponse) {
    option (google.api.http) = { put: "/v1/channels/{channel_id}/voice/me/deaf" body: "*" };
  }
  rpc Undeafen(VoiceChannelRequest) returns (VoiceParticipantsResponse) {
    option (google.api.http) = { delete: "/v1/channels/{channel_id}/voice/me/deaf" };
  }
  rpc EnableVideo(VoiceChannelRequest) returns (VoiceParticipantsResponse) {
    option (google.api.http) = { put: "/v1/channels/{channel_id}/voice/me/video" body: "*" };
  }
  rpc DisableVideo(VoiceChannelRequest) returns (VoiceParticipantsResponse) {
    option (google.api.http) = { delete: "/v1/channels/{channel_id}/voice/me/video" };
  }
  rpc StartScreenShare(VoiceChannelRequest) returns (VoiceParticipantsResponse) {
    option (google.api.http) = { put: "/v1/channels/{channel_id}/voice/me/screen" body: "*" };
  }
  rpc StopScreenShare(VoiceChannelRequest) returns (VoiceParticipantsResponse) {
    option (google.api.http) = { delete: "/v1/channels/{channel_id}/voice/me/screen" };
  }
  // Moderator-level ops: act on a specific participant. PUT body carries
  // the boolean because the action is "set muted=true/false", not strictly
  // idempotent toggle (admin may force-mute regardless of current state).
  rpc ServerMuteUser(ServerMuteUserRequest) returns (ServerMuteUserResponse) {
    option (google.api.http) = {
      put: "/v1/channels/{channel_id}/voice/participants/{target_user_id}/mute"
      body: "*"
    };
  }
  rpc ServerDeafenUser(ServerDeafenUserRequest) returns (ServerDeafenUserResponse) {
    option (google.api.http) = {
      put: "/v1/channels/{channel_id}/voice/participants/{target_user_id}/deaf"
      body: "*"
    };
  }
  rpc DisconnectUser(DisconnectUserRequest) returns (DisconnectUserResponse) {
    option (google.api.http) = {
      delete: "/v1/channels/{channel_id}/voice/participants/{target_user_id}"
    };
  }
}


message ServerMuteUserRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  string target_user_id = 2 [(buf.validate.field).string.uuid = true];
  bool muted = 3;
}
message ServerMuteUserResponse {}

message ServerDeafenUserRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  string target_user_id = 2 [(buf.validate.field).string.uuid = true];
  bool deafened = 3;
}
message ServerDeafenUserResponse {}

message DisconnectUserRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  string target_user_id = 2 [(buf.validate.field).string.uuid = true];
}
message DisconnectUserResponse {}

message JoinChannelRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string channel_id = 2 [(buf.validate.field).string.uuid = true];
}

message JoinChannelResponse {
  string url = 1;
  string token = 2;
  string room = 3;
  int32 expires_in = 4;
}

message LeaveChannelRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string channel_id = 2 [(buf.validate.field).string.uuid = true];
}

message LeaveChannelResponse {}

message VoiceParticipant {
  string user_id = 1;
  string identity = 2;
  string sid = 3;
  string name = 4;
  google.protobuf.Timestamp joined_at = 5;
  bool self_mute = 6;
  bool self_deaf = 7;
  bool server_mute = 8;
  bool server_deaf = 9;
  bool video = 10;
  bool screen_share = 11;
}

message GetChannelParticipantsRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetChannelParticipantsResponse {
  repeated VoiceParticipant participants = 1;
}


message StartDMCallRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  bool video = 2;
}

message StartDMCallResponse {
  string url = 1;
  string token = 2;
  string room = 3;
  int32 expires_in = 4;
}

message JoinDMCallRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  bool video = 2;
}

message JoinDMCallResponse {
  string url = 1;
  string token = 2;
  string room = 3;
  int32 expires_in = 4;
}

message RejectDMCallRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message RejectDMCallResponse {}

message LeaveDMCallRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message LeaveDMCallResponse {}


message VoiceChannelRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message VoiceParticipantsResponse {
  repeated VoiceParticipant participants = 1;
}

