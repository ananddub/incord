syntax = "proto3";

package voice.v1;

option go_package = "github.com/ananddub/ndiscord_backend/gen/voice/v1;voicev1";

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

// VoiceService issues LiveKit access tokens so clients can connect directly
// to the LiveKit SFU over WebRTC. The backend itself never handles media —
// it only handles auth, room metadata, and participant bookkeeping.
service VoiceService {
  // JoinChannel returns a LiveKit URL + short-lived JWT. The client is
  // expected to feed these into a LiveKit client SDK (web/iOS/Android/Flutter)
  // and let it negotiate DTLS-SRTP/WebRTC directly with the SFU.
  rpc JoinChannel(JoinChannelRequest) returns (JoinChannelResponse);
  rpc LeaveChannel(LeaveChannelRequest) returns (LeaveChannelResponse);
  rpc GetChannelParticipants(GetChannelParticipantsRequest) returns (GetChannelParticipantsResponse);

  // === DM calls ===
  // StartDMCall initiates a voice/video call inside an existing DM channel.
  // The caller immediately gets a LiveKit token; all other members receive
  // a "call_incoming" push on their StreamDmCalls stream.
  rpc StartDMCall(StartDMCallRequest) returns (StartDMCallResponse);
  // JoinDMCall is called by a ringing recipient to accept the call and
  // obtain their own LiveKit token. Other members get a "call_accepted" push.
  rpc JoinDMCall(JoinDMCallRequest) returns (JoinDMCallResponse);
  // RejectDMCall is called by a recipient to decline — the caller gets a
  // "call_rejected" push. No LiveKit token is minted.
  rpc RejectDMCall(RejectDMCallRequest) returns (RejectDMCallResponse);
  // LeaveDMCall is called when a participant hangs up. When the last
  // participant leaves, a "call_ended" push is fanned out to all members.
  rpc LeaveDMCall(LeaveDMCallRequest) returns (LeaveDMCallResponse);

  // Self voice controls — each toggle is a separate RPC. Server updates
  // Redis and broadcasts the full participant list to StreamVoiceState.
  rpc Mute(VoiceChannelRequest) returns (VoiceParticipantsResponse);
  rpc Unmute(VoiceChannelRequest) returns (VoiceParticipantsResponse);
  rpc Deafen(VoiceChannelRequest) returns (VoiceParticipantsResponse);
  rpc Undeafen(VoiceChannelRequest) returns (VoiceParticipantsResponse);
  rpc EnableVideo(VoiceChannelRequest) returns (VoiceParticipantsResponse);
  rpc DisableVideo(VoiceChannelRequest) returns (VoiceParticipantsResponse);
  rpc StartScreenShare(VoiceChannelRequest) returns (VoiceParticipantsResponse);
  rpc StopScreenShare(VoiceChannelRequest) returns (VoiceParticipantsResponse);

  // Admin controls — guild owner/moderator can force state on other participants.
  rpc ServerMuteUser(ServerMuteUserRequest) returns (ServerMuteUserResponse);
  rpc ServerDeafenUser(ServerDeafenUserRequest) returns (ServerDeafenUserResponse);
  rpc DisconnectUser(DisconnectUserRequest) returns (DisconnectUserResponse);
}

// === Admin voice control messages ===

message ServerMuteUserRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  string target_user_id = 2 [(buf.validate.field).string.uuid = true];
  bool muted = 3;
}
message ServerMuteUserResponse {}

message ServerDeafenUserRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  string target_user_id = 2 [(buf.validate.field).string.uuid = true];
  bool deafened = 3;
}
message ServerDeafenUserResponse {}

message DisconnectUserRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  string target_user_id = 2 [(buf.validate.field).string.uuid = true];
}
message DisconnectUserResponse {}

message JoinChannelRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string channel_id = 2 [(buf.validate.field).string.uuid = true];
}

message JoinChannelResponse {
  // WebSocket URL of the LiveKit SFU (e.g. "ws://192.168.1.2:7880").
  string url = 1;
  // Short-lived JWT access token — pass into LiveKit client SDK.
  string token = 2;
  // Room name (one LiveKit room per voice channel).
  string room = 3;
  // Seconds until the token expires.
  int32 expires_in = 4;
}

message LeaveChannelRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string channel_id = 2 [(buf.validate.field).string.uuid = true];
}

message LeaveChannelResponse {}

message VoiceParticipant {
  string user_id = 1;
  string identity = 2;
  string sid = 3;
  string name = 4;
  google.protobuf.Timestamp joined_at = 5;
  bool self_mute = 6;
  bool self_deaf = 7;
  bool server_mute = 8;
  bool server_deaf = 9;
  bool video = 10;
  bool screen_share = 11;
}

message GetChannelParticipantsRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetChannelParticipantsResponse {
  repeated VoiceParticipant participants = 1;
}

// === DM call messages ===

message StartDMCallRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  // If true, the caller intends to publish video; audio is always on.
  bool video = 2;
}

message StartDMCallResponse {
  string url = 1;
  string token = 2;
  string room = 3;
  int32 expires_in = 4;
}

message JoinDMCallRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  bool video = 2;
}

message JoinDMCallResponse {
  string url = 1;
  string token = 2;
  string room = 3;
  int32 expires_in = 4;
}

message RejectDMCallRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message RejectDMCallResponse {}

message LeaveDMCallRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message LeaveDMCallResponse {}

// === Voice state sync ===

// Shared request for all self voice controls — just needs channel_id.
message VoiceChannelRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

// Returns the full channel participant list after the state change.
message VoiceParticipantsResponse {
  repeated VoiceParticipant participants = 1;
}

