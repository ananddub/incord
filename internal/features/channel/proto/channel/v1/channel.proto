syntax = "proto3";

package channel.v1;

option go_package = "github.com/ananddub/ndiscord_backend/gen/channel/v1;channelv1";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "buf/validate/validate.proto";

service ChannelService {
  // Guild channels are nested under /v1/guilds/{guild_id}/channels so the
  // URL reflects the parent → child relationship. Single-resource ops
  // (GET / PATCH / DELETE) go through /v1/channels/{channel_id} because
  // a channel id is already globally unique.
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse) {
    option (google.api.http) = { post: "/v1/guilds/{guild_id}/channels" body: "*" };
  }
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse) {
    option (google.api.http) = { get: "/v1/channels/{channel_id}" };
  }
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse) {
    option (google.api.http) = { patch: "/v1/channels/{channel_id}" body: "*" };
  }
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse) {
    option (google.api.http) = { delete: "/v1/channels/{channel_id}" };
  }
  rpc ListGuildChannels(ListGuildChannelsRequest) returns (ListGuildChannelsResponse) {
    option (google.api.http) = { get: "/v1/guilds/{guild_id}/channels" };
  }
  // DM channels live under /v1/dms (no parent guild).
  rpc CreateDMChannel(CreateDMChannelRequest) returns (CreateDMChannelResponse) {
    option (google.api.http) = { post: "/v1/dms" body: "*" };
  }
  rpc ListDMChannels(ListDMChannelsRequest) returns (ListDMChannelsResponse) {
    option (google.api.http) = { get: "/v1/dms" };
  }
  rpc ListDMChannelMembers(ListDMChannelMembersRequest) returns (ListDMChannelMembersResponse) {
    option (google.api.http) = { get: "/v1/dms/{channel_id}/members" };
  }
  rpc ListDMChannelsWithMembers(ListDMChannelsWithMembersRequest) returns (ListDMChannelsWithMembersResponse) {
    // Convenience variant — DMs + their member lists in one call.
    option (google.api.http) = { get: "/v1/dms:withMembers" };
  }
  rpc AddDMGroupMember(AddDMGroupMemberRequest) returns (AddDMGroupMemberResponse) {
    option (google.api.http) = { put: "/v1/dms/{channel_id}/members/{user_id}" body: "*" };
  }
  rpc RemoveDMGroupMember(RemoveDMGroupMemberRequest) returns (RemoveDMGroupMemberResponse) {
    option (google.api.http) = { delete: "/v1/dms/{channel_id}/members/{user_id}" };
  }

  // Per-channel allow/deny permission overrides. Layered on top of the
  // guild-level role permissions — Discord precedence rules apply
  // (user beats role, deny beats allow within a layer for user, allow
  // beats deny within a layer for role; owner and ADMINISTRATOR bypass).
  rpc SetChannelOverride(SetChannelOverrideRequest) returns (SetChannelOverrideResponse) {
    // PUT on the (channel, target_type, target_id, permission) tuple —
    // idempotent upsert of an allow/deny rule.
    option (google.api.http) = {
      put: "/v1/channels/{channel_id}/overrides/{target_type}/{target_id}/{permission}"
      body: "*"
    };
  }
  rpc DeleteChannelOverride(DeleteChannelOverrideRequest) returns (DeleteChannelOverrideResponse) {
    option (google.api.http) = {
      delete: "/v1/channels/{channel_id}/overrides/{target_type}/{target_id}/{permission}"
    };
  }
  rpc ListChannelOverrides(ListChannelOverridesRequest) returns (ListChannelOverridesResponse) {
    option (google.api.http) = { get: "/v1/channels/{channel_id}/overrides" };
  }
}

enum OverrideTargetType {
  OVERRIDE_TARGET_UNSPECIFIED = 0;
  OVERRIDE_TARGET_ROLE = 1;
  OVERRIDE_TARGET_USER = 2;
}

enum OverrideEffect {
  OVERRIDE_EFFECT_UNSPECIFIED = 0;
  OVERRIDE_EFFECT_ALLOW = 1;
  OVERRIDE_EFFECT_DENY = 2;
}

message ChannelOverride {
  string target_type = 1;  // "role" or "user"
  string target_id = 2;
  string permission = 3;   // Discord name, e.g. "SEND_MESSAGES"
  string effect = 4;       // "allow" or "deny"
}

enum ChannelType {
  CHANNEL_TYPE_UNSPECIFIED = 0;
  CHANNEL_TYPE_TEXT = 1;
  CHANNEL_TYPE_VOICE = 2;
  CHANNEL_TYPE_VIDEO = 3;
  CHANNEL_TYPE_CATEGORY = 4;
  CHANNEL_TYPE_DM = 5;
  CHANNEL_TYPE_GROUP_DM = 6;
  CHANNEL_TYPE_ANNOUNCEMENT = 7;
  CHANNEL_TYPE_FORUM = 8;
  CHANNEL_TYPE_STAGE = 9;
}

message Channel {
  string id = 1;
  string guild_id = 2;
  string name = 3;
  ChannelType type = 4;
  string topic = 5;
  int32 position = 6;
  string parent_id = 7;
  google.protobuf.Timestamp created_at = 8;
}

message SetChannelOverrideRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  string target_type = 2 [(buf.validate.field).string = {in: ["role", "user"]}];
  string target_id = 3 [(buf.validate.field).string.uuid = true];
  string permission = 4 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string effect = 5 [(buf.validate.field).string = {in: ["allow", "deny"]}];
}
message SetChannelOverrideResponse {}

message DeleteChannelOverrideRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  string target_type = 2 [(buf.validate.field).string = {in: ["role", "user"]}];
  string target_id = 3 [(buf.validate.field).string.uuid = true];
  string permission = 4 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}
message DeleteChannelOverrideResponse {}

message ListChannelOverridesRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}
message ListChannelOverridesResponse {
  repeated ChannelOverride overrides = 1;
}

message CreateChannelRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  ChannelType type = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string topic = 4 [(buf.validate.field).string = {max_len: 1024}];
  string parent_id = 5 [(buf.validate.field).string = {max_len: 64}];
}

message CreateChannelResponse {
  Channel channel = 1;
}

message GetChannelRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetChannelResponse {
  Channel channel = 1;
}

message UpdateChannelRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  optional string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  optional string topic = 3 [(buf.validate.field).string = {max_len: 1024}];
  optional int32 position = 4 [(buf.validate.field).int32.gte = 0];
  optional string parent_id = 5 [(buf.validate.field).string = {max_len: 64}];
}

message UpdateChannelResponse {
  Channel channel = 1;
}

message DeleteChannelRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteChannelResponse {}

message ListGuildChannelsRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListGuildChannelsResponse {
  repeated Channel channels = 1;
}

message CreateDMChannelRequest {
  repeated string recipient_ids = 1 [(buf.validate.field).repeated = {min_items: 1, max_items: 10, items: {string: {uuid: true}}}];
}

message CreateDMChannelResponse {
  Channel channel = 1;
}

message ListDMChannelsRequest {}

message ListDMChannelsResponse {
  repeated Channel channels = 1;
}

// DMMember is a lightweight user profile embedded in DM channel responses so
// clients don't need a second round trip to UserService to render the list.
message DMMember {
  string id = 1;
  string username = 2;      // full "name#1234" handle
  string display_name = 3;
  string avatar_url = 4;
  string status = 5;
}

message ListDMChannelMembersRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListDMChannelMembersResponse {
  repeated DMMember members = 1;
}

message DMChannelWithMembers {
  string id = 1;
  string guild_id = 2;
  string name = 3;
  ChannelType type = 4;
  string topic = 5;
  int32 position = 6;
  string parent_id = 7;
  google.protobuf.Timestamp created_at = 8;
  repeated DMMember members = 9;
}

message ListDMChannelsWithMembersRequest {}

message ListDMChannelsWithMembersResponse {
  repeated DMChannelWithMembers channels = 1;
}

message AddDMGroupMemberRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

message AddDMGroupMemberResponse {}

message RemoveDMGroupMemberRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

message RemoveDMGroupMemberResponse {}
