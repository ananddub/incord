syntax = "proto3";

package channel.v1;

option go_package = "github.com/ananddub/ndiscord_backend/gen/channel/v1;channelv1";

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

service ChannelService {
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse);
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse);
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse);
  rpc ListGuildChannels(ListGuildChannelsRequest) returns (ListGuildChannelsResponse);
  rpc CreateDMChannel(CreateDMChannelRequest) returns (CreateDMChannelResponse);
  rpc ListDMChannels(ListDMChannelsRequest) returns (ListDMChannelsResponse);
  rpc AddDMGroupMember(AddDMGroupMemberRequest) returns (AddDMGroupMemberResponse);
  rpc RemoveDMGroupMember(RemoveDMGroupMemberRequest) returns (RemoveDMGroupMemberResponse);
}

enum ChannelType {
  CHANNEL_TYPE_UNSPECIFIED = 0;
  CHANNEL_TYPE_TEXT = 1;
  CHANNEL_TYPE_VOICE = 2;
  CHANNEL_TYPE_VIDEO = 3;
  CHANNEL_TYPE_CATEGORY = 4;
  CHANNEL_TYPE_DM = 5;
  CHANNEL_TYPE_GROUP_DM = 6;
  CHANNEL_TYPE_ANNOUNCEMENT = 7;
  CHANNEL_TYPE_FORUM = 8;
  CHANNEL_TYPE_STAGE = 9;
}

message Channel {
  string id = 1;
  string guild_id = 2;
  string name = 3;
  ChannelType type = 4;
  string topic = 5;
  int32 position = 6;
  string parent_id = 7;
  google.protobuf.Timestamp created_at = 8;
}

message CreateChannelRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  ChannelType type = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string topic = 4 [(buf.validate.field).string = {max_len: 1024}];
  string parent_id = 5 [(buf.validate.field).string = {max_len: 64}];
}

message CreateChannelResponse {
  Channel channel = 1;
}

message GetChannelRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetChannelResponse {
  Channel channel = 1;
}

message UpdateChannelRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  optional string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  optional string topic = 3 [(buf.validate.field).string = {max_len: 1024}];
  optional int32 position = 4 [(buf.validate.field).int32.gte = 0];
  optional string parent_id = 5 [(buf.validate.field).string = {max_len: 64}];
}

message UpdateChannelResponse {
  Channel channel = 1;
}

message DeleteChannelRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteChannelResponse {}

message ListGuildChannelsRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListGuildChannelsResponse {
  repeated Channel channels = 1;
}

message CreateDMChannelRequest {
  repeated string recipient_ids = 1 [(buf.validate.field).repeated = {min_items: 1, max_items: 10, items: {string: {uuid: true}}}];
}

message CreateDMChannelResponse {
  Channel channel = 1;
}

message ListDMChannelsRequest {}

message ListDMChannelsResponse {
  repeated Channel channels = 1;
}

message AddDMGroupMemberRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

message AddDMGroupMemberResponse {}

message RemoveDMGroupMemberRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

message RemoveDMGroupMemberResponse {}
