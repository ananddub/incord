syntax = "proto3";

package gateway.v1;

option go_package = "github.com/ananddub/ndiscord_backend/gen/gateway/v1;gatewayv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

service GatewayService {
  // Bidirectional streaming - client sends commands, server sends events
  rpc Connect(stream ClientMessage) returns (stream ServerEvent);
}

// Client → Server
message ClientMessage {
  oneof payload {
    Identify identify = 1;
    Heartbeat heartbeat = 2;
    Resume resume = 3;
    RequestGuildMembers request_guild_members = 4;
    UpdatePresence update_presence = 5;
    UpdateVoiceState update_voice_state = 6;
  }
}

message Identify {
  string token = 1;
}

message Heartbeat {
  int64 sequence = 1;
}

message Resume {
  string token = 1;
  string session_id = 2;
  int64 last_sequence = 3;
}

message RequestGuildMembers {
  string guild_id = 1;
  string query = 2;
  int32 limit = 3;
}

message UpdatePresence {
  PresenceStatus status = 1;
  string custom_status = 2;
}

message UpdateVoiceState {
  string guild_id = 1;
  string channel_id = 2;
  bool self_mute = 3;
  bool self_deaf = 4;
}

// Server → Client
message ServerEvent {
  EventType type = 1;
  int64 sequence = 2;
  google.protobuf.Timestamp timestamp = 3;

  oneof data {
    Ready ready = 10;
    HeartbeatAck heartbeat_ack = 11;
    Resumed resumed = 12;
    MessageCreate message_create = 13;
    MessageUpdate message_update = 14;
    MessageDelete message_delete = 15;
    TypingStart typing_start = 16;
    PresenceUpdate presence_update = 17;
    GuildCreate guild_create = 18;
    GuildUpdate guild_update = 19;
    GuildDelete guild_delete = 20;
    GuildMemberAdd guild_member_add = 21;
    GuildMemberRemove guild_member_remove = 22;
    ChannelCreate channel_create = 23;
    ChannelUpdate channel_update = 24;
    ChannelDelete channel_delete = 25;
    VoiceStateUpdate voice_state_update = 26;
    VoiceServerUpdate voice_server_update = 27;
  }
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_READY = 1;
  EVENT_TYPE_HEARTBEAT_ACK = 2;
  EVENT_TYPE_RESUMED = 3;
  EVENT_TYPE_MESSAGE_CREATE = 4;
  EVENT_TYPE_MESSAGE_UPDATE = 5;
  EVENT_TYPE_MESSAGE_DELETE = 6;
  EVENT_TYPE_TYPING_START = 7;
  EVENT_TYPE_PRESENCE_UPDATE = 8;
  EVENT_TYPE_GUILD_CREATE = 9;
  EVENT_TYPE_GUILD_UPDATE = 10;
  EVENT_TYPE_GUILD_DELETE = 11;
  EVENT_TYPE_GUILD_MEMBER_ADD = 12;
  EVENT_TYPE_GUILD_MEMBER_REMOVE = 13;
  EVENT_TYPE_CHANNEL_CREATE = 14;
  EVENT_TYPE_CHANNEL_UPDATE = 15;
  EVENT_TYPE_CHANNEL_DELETE = 16;
  EVENT_TYPE_VOICE_STATE_UPDATE = 17;
  EVENT_TYPE_VOICE_SERVER_UPDATE = 18;
}

enum PresenceStatus {
  PRESENCE_STATUS_UNSPECIFIED = 0;
  PRESENCE_STATUS_ONLINE = 1;
  PRESENCE_STATUS_IDLE = 2;
  PRESENCE_STATUS_DND = 3;
  PRESENCE_STATUS_OFFLINE = 4;
}

message Ready {
  string session_id = 1;
  string user_id = 2;
  repeated string guild_ids = 3;
  int64 heartbeat_interval_ms = 4;
}

message HeartbeatAck {
  int64 sequence = 1;
}

message Resumed {}

message MessageCreate {
  string id = 1;
  string channel_id = 2;
  string guild_id = 3;
  string author_id = 4;
  string content = 5;
  google.protobuf.Timestamp timestamp = 6;
}

message MessageUpdate {
  string id = 1;
  string channel_id = 2;
  string guild_id = 3;
  string content = 4;
  google.protobuf.Timestamp edited_at = 5;
}

message MessageDelete {
  string id = 1;
  string channel_id = 2;
  string guild_id = 3;
}

message TypingStart {
  string channel_id = 1;
  string guild_id = 2;
  string user_id = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message PresenceUpdate {
  string user_id = 1;
  PresenceStatus status = 2;
  string custom_status = 3;
}

message GuildCreate {
  string id = 1;
  string name = 2;
  string icon_url = 3;
  string owner_id = 4;
  int32 member_count = 5;
}

message GuildUpdate {
  string id = 1;
  string name = 2;
  string icon_url = 3;
}

message GuildDelete {
  string id = 1;
}

message GuildMemberAdd {
  string guild_id = 1;
  string user_id = 2;
}

message GuildMemberRemove {
  string guild_id = 1;
  string user_id = 2;
}

message ChannelCreate {
  string id = 1;
  string guild_id = 2;
  string name = 3;
  int32 type = 4;
}

message ChannelUpdate {
  string id = 1;
  string guild_id = 2;
  string name = 3;
  string topic = 4;
}

message ChannelDelete {
  string id = 1;
  string guild_id = 2;
}

message VoiceStateUpdate {
  string guild_id = 1;
  string channel_id = 2;
  string user_id = 3;
  string session_id = 4;
  bool self_mute = 5;
  bool self_deaf = 6;
}

message VoiceServerUpdate {
  string guild_id = 1;
  string token = 2;
  string endpoint = 3;
}
