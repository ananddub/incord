syntax = "proto3";

package sync.v1;

option go_package = "github.com/ananddub/ndiscord_backend/gen/sync/v1;syncv1";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

// Incremental delta pull: client sends last_sync_time, server returns every
// row touched since. POST because the body carries an (optional) timestamp
// and this is a client-driven refresh, not a cacheable GET.
service SyncService {
  rpc Sync(SyncRequest) returns (SyncResponse) {
    option (google.api.http) = { post: "/v1/sync" body: "*" };
  }
}

message SyncRequest {
  google.protobuf.Timestamp last_sync_time = 1;
}

message SyncResponse {
  google.protobuf.Timestamp server_time = 1;

  repeated SyncUser users = 2;

  repeated SyncGuild guilds = 3;

  repeated SyncChannel channels = 4;

  repeated SyncRole roles = 5;

  repeated SyncGuildMember guild_members = 6;

  repeated SyncFriendship friendships = 7;

  repeated SyncMessage messages = 8;

  repeated SyncDmMember dm_members = 9;
}


message SyncUser {
  string id = 1;
  bool is_deleted = 2;
  google.protobuf.Timestamp updated_at = 3;
  string username = 4;
  string email = 5;
  string avatar_url = 6;
  string bio = 7;
  string status = 8;
  bool verified = 9;
  string background_color = 10;
}

message SyncGuild {
  string id = 1;
  bool is_deleted = 2;
  google.protobuf.Timestamp updated_at = 3;
  string name = 4;
  string description = 5;
  string icon_url = 6;
  string owner_id = 7;
}

message SyncChannel {
  string id = 1;
  bool is_deleted = 2;
  google.protobuf.Timestamp updated_at = 3;
  string guild_id = 4;
  string name = 5;
  int32 type = 6;
  string topic = 7;
  int32 position = 8;
  string parent_id = 9;
}

message SyncRole {
  string id = 1;
  bool is_deleted = 2;
  google.protobuf.Timestamp updated_at = 3;
  string guild_id = 4;
  string name = 5;
  string color = 6;
  int32 position = 7;
}

message SyncGuildMember {
  string guild_id = 1;
  string user_id = 2;
  bool is_deleted = 3;
  google.protobuf.Timestamp updated_at = 4;
  string nickname = 5;
}

message SyncFriendship {
  string user_id = 1;
  string friend_id = 2;
  bool is_deleted = 3;
  google.protobuf.Timestamp updated_at = 4;
  string status = 5;  
}

message SyncMessage {
  string channel_id = 1;
  string id = 2;
  bool is_deleted = 3;
  google.protobuf.Timestamp updated_at = 4;
  string author_id = 5;
  string content = 6;
  int32 type = 7;
  string reply_to_id = 8;
  bool pinned = 9;
}

message SyncDmMember {
  string channel_id = 1;
  string user_id = 2;
  bool is_deleted = 3;
  google.protobuf.Timestamp updated_at = 4;
}
