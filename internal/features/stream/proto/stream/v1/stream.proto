syntax = "proto3";

package stream.v1;

option go_package = "github.com/ananddub/ndiscord_backend/gen/stream/v1;streamv1";

import "google/protobuf/timestamp.proto";

// === Enums ===
//
// These enums are paired with hand-written Wire() helpers in wire.go that
// translate each value into the exact snake_case/upper-case string used on
// the NATS wire. Message fields stay typed as `string` so subscribers
// (including external clients) don't have to change their JSON decoders;
// publishers should always go through `Enum_VALUE.Wire()` instead of
// hand-typing the tag string.

// Chat events — used for DmChatEvent.type, TextChannelEvent.type and
// VoiceChatEvent.type.
enum ChatEventType {
  CHAT_EVENT_UNSPECIFIED = 0;
  CHAT_EVENT_CREATE = 1;
  CHAT_EVENT_UPDATE = 2;
  CHAT_EVENT_DELETE = 3;
  CHAT_EVENT_PIN = 4;
  CHAT_EVENT_UNPIN = 5;
  CHAT_EVENT_REACTION_ADD = 6;
  CHAT_EVENT_REACTION_REMOVE = 7;
  CHAT_EVENT_READ_RECEIPT = 8;
}

// DM channel lifecycle — used for DmChannelEvent.type.
enum ChannelLifecycleType {
  CHANNEL_LIFECYCLE_UNSPECIFIED = 0;
  CHANNEL_LIFECYCLE_CREATE = 1;
  CHANNEL_LIFECYCLE_UPDATE = 2;
  CHANNEL_LIFECYCLE_DELETE = 3;
}

// DM call signalling — used for DmCallEvent.type.
enum DmCallType {
  DM_CALL_UNSPECIFIED = 0;
  DM_CALL_INCOMING = 1;
  DM_CALL_ACCEPTED = 2;
  DM_CALL_REJECTED = 3;
  DM_CALL_ENDED = 4;
  DM_CALL_PARTICIPANT_LEFT = 5;
}

// Voice event — used for VoiceStateEvent.event (currently single-valued
// but defined as an enum so hardcoded strings never leak back in).
enum VoiceEvent {
  VOICE_EVENT_UNSPECIFIED = 0;
  VOICE_EVENT_STATE_UPDATE = 1;
}

// Voice action — used for VoiceStateEvent.action.
enum VoiceAction {
  VOICE_ACTION_UNSPECIFIED = 0;
  VOICE_ACTION_JOIN = 1;
  VOICE_ACTION_LEAVE = 2;
  VOICE_ACTION_PARTICIPANT_JOINED = 3;
  VOICE_ACTION_PARTICIPANT_LEFT = 4;
  VOICE_ACTION_TRACK_UPDATE = 5;
  VOICE_ACTION_STATE_SYNC = 6;
  VOICE_ACTION_STATE_UPDATE = 7;
  VOICE_ACTION_ROOM_STARTED = 8;
  VOICE_ACTION_ROOM_FINISHED = 9;
}

// Voice track kind — used for VoiceStateEvent.track_type.
enum VoiceTrackType {
  VOICE_TRACK_UNSPECIFIED = 0;
  VOICE_TRACK_AUDIO = 1;
  VOICE_TRACK_VIDEO = 2;
  VOICE_TRACK_SCREEN_SHARE = 3;
}

// Friend/presence activity — used for FriendActivityEvent.event.
enum FriendEventType {
  FRIEND_EVENT_UNSPECIFIED = 0;
  FRIEND_EVENT_PRESENCE_UPDATE = 1;
  FRIEND_EVENT_PROFILE_UPDATE = 2;
  FRIEND_EVENT_REQUEST = 3;
  FRIEND_EVENT_ACCEPTED = 4;
  FRIEND_EVENT_DECLINED = 5;
  FRIEND_EVENT_REMOVED = 6;
  FRIEND_EVENT_REQUEST_CANCELLED = 7;
}

// User presence — used for FriendActivityEvent.status and wherever a
// human-readable presence string is emitted.
enum PresenceStatus {
  PRESENCE_STATUS_UNSPECIFIED = 0;
  PRESENCE_STATUS_ONLINE = 1;
  PRESENCE_STATUS_IDLE = 2;
  PRESENCE_STATUS_DND = 3;
  PRESENCE_STATUS_OFFLINE = 4;
}

// Guild-level event — used for GuildEvent.event (+ GuildEvent.action,
// which currently mirrors event).
enum GuildEventType {
  GUILD_EVENT_UNSPECIFIED = 0;
  GUILD_EVENT_MEMBER_ADD = 1;
  GUILD_EVENT_MEMBER_REMOVE = 2;
  GUILD_EVENT_MEMBER_BAN = 3;
  GUILD_EVENT_MEMBER_UNBAN = 4;
  GUILD_EVENT_UPDATE = 5;
  GUILD_EVENT_DELETE = 6;
  GUILD_EVENT_ROLE_CREATE = 7;
  GUILD_EVENT_ROLE_UPDATE = 8;
  GUILD_EVENT_ROLE_DELETE = 9;
  GUILD_EVENT_ROLE_ASSIGN = 10;
  GUILD_EVENT_ROLE_REMOVE = 11;
  GUILD_EVENT_CHANNEL_CREATE = 12;
  GUILD_EVENT_CHANNEL_UPDATE = 13;
  GUILD_EVENT_CHANNEL_DELETE = 14;
}

service StreamService {
  rpc StreamDmChat(StreamDmChatRequest) returns (stream DmChatEvent);

  rpc StreamDmChannels(StreamDmChannelsRequest) returns (stream DmChannelEvent);

  rpc StreamDmCalls(StreamDmCallsRequest) returns (stream DmCallEvent);

  rpc StreamTextChannels(StreamTextChannelsRequest) returns (stream TextChannelEvent);

  rpc StreamVoiceChat(StreamVoiceChatRequest) returns (stream VoiceChatEvent);

  rpc StreamGuildEvents(StreamGuildEventsRequest) returns (stream GuildEvent);

  rpc StreamVoiceState(StreamVoiceStateRequest) returns (stream VoiceStateEvent);

  rpc StreamTyping(StreamTypingRequest) returns (stream TypingEvent);

  rpc StreamFriendActivity(StreamFriendActivityRequest) returns (stream FriendActivityEvent);
}

// === Shared chat payloads ===

// ChatAttachment mirrors message.v1.Attachment for stream payloads so the
// stream feature doesn't pull in the whole message proto. Reused by every
// chat-like event (DM + guild text + guild voice chat).
message ChatAttachment {
  string id = 1;
  string filename = 2;
  string url = 3;
  string content_type = 4;
  int64 size = 5;
}

// ChatReactionCount is a per-emoji snapshot of a message's reactions.
// Reused across all chat events so clients never have to recompute totals
// from raw reaction_add / reaction_remove deltas.
message ChatReactionCount {
  string emoji = 1;
  int32 count = 2;
  // True if the current stream subscriber has reacted with this emoji.
  // On a fan-out subject we don't know the receiver, so this is populated
  // best-effort by the server for the event's `sender_id` perspective —
  // clients should still maintain their own self-reaction set.
  bool me = 3;
}

// ChatForwardedReference points at the message a forward was created from.
// Mirrors message.v1.ForwardedReference; kept flat for stream payloads.
message ChatForwardedReference {
  string channel_id = 1;
  string message_id = 2;
  string author_id = 3;
}

// === DM Chat (all DMs, auto-detect) ===

message StreamDmChatRequest {}

message DmChatEvent {
  ChatEventType type = 1;
  string channel_id = 2;
  string message_id = 3;
  // The user who initiated the event (sender/editor/reactor/etc.).
  string sender_id = 4;
  // Message author — present on create/update/delete/pin/unpin.
  string author_id = 10;
  // On "update" this is the new content; on "create" it's the initial
  // content; on "delete" it is empty.
  string content = 5;
  google.protobuf.Timestamp timestamp = 6;
  string reply_to_id = 7;
  repeated ChatAttachment attachments = 8;
  // Underlying MessageType int (1=default, 3=reply, ...).
  int32 msg_type = 9;
  bool pinned = 11;
  bool deleted = 12;
  // Populated on reaction_add / reaction_remove events.
  string emoji = 13;
  string edited_at = 14;
  string created_at = 15;
  // User IDs explicitly @-mentioned by the author. Empty on non-create
  // events where mentions don't change.
  repeated string mention_user_ids = 16;
  // Full per-emoji reaction snapshot — sent on create/update/delete/pin
  // AND on reaction_add / reaction_remove so clients can render counts
  // without recomputing from deltas.
  repeated ChatReactionCount reactions = 17;
  // Populated when this message is a forward of another.
  ChatForwardedReference forwarded_from = 18;
}

// === DM Channels lifecycle ===

message StreamDmChannelsRequest {}

message DmChannelMember {
  string id = 1;
  string username = 2;      // full "name#1234"
  string display_name = 3;
  string avatar_url = 4;
  string status = 5;
}

message DmChannelEvent {
  ChannelLifecycleType type = 1;
  string id = 2;            // channel id
  string name = 3;
  int32 channel_type = 4;   // 5=DM, 6=GROUP_DM
  repeated DmChannelMember members = 5;
}

// === DM Calls ===

message StreamDmCallsRequest {}

message DmCallEvent {
  DmCallType type = 1;
  string channel_id = 2;
  // The user who initiated the call (present on every event so late
  // subscribers can identify the ongoing call).
  string caller_id = 3;
  // The specific participant this event is about (accepted/rejected/left).
  string participant_id = 4;
  // True if the caller intends to publish video (camera).
  bool video = 5;
  google.protobuf.Timestamp timestamp = 6;
}

// === Text Channels (all guilds, auto-detect) ===

message StreamTextChannelsRequest {}

// TextChannelEvent carries the same rich payload as DmChatEvent so guild
// channel subscribers can render replies, attachments, reactions and
// mentions without additional round trips.
message TextChannelEvent {
  ChatEventType type = 1;
  string guild_id = 2;
  string channel_id = 3;
  string message_id = 4;
  // Message author — present on create/update/delete/pin/unpin.
  string author_id = 5;
  // On "update" this is the new content; on "create" it's the initial
  // content; on "delete" it is empty.
  string content = 6;
  google.protobuf.Timestamp timestamp = 7;
  // The user who initiated this event. Differs from author_id on
  // moderation-style edits/deletes.
  string sender_id = 8;
  string reply_to_id = 9;
  repeated ChatAttachment attachments = 10;
  int32 msg_type = 11;
  bool pinned = 12;
  bool deleted = 13;
  // Populated on reaction_add / reaction_remove events.
  string emoji = 14;
  string edited_at = 15;
  string created_at = 16;
  repeated string mention_user_ids = 17;
  repeated ChatReactionCount reactions = 18;
  ChatForwardedReference forwarded_from = 19;
}

// === Voice Chat (text in voice channels, all guilds) ===

message StreamVoiceChatRequest {}

// VoiceChatEvent is identical in shape to TextChannelEvent — text chat
// that happens inside a voice channel.
message VoiceChatEvent {
  ChatEventType type = 1;
  string guild_id = 2;
  string channel_id = 3;
  string message_id = 4;
  string author_id = 5;
  string content = 6;
  google.protobuf.Timestamp timestamp = 7;
  string sender_id = 8;
  string reply_to_id = 9;
  repeated ChatAttachment attachments = 10;
  int32 msg_type = 11;
  bool pinned = 12;
  bool deleted = 13;
  string emoji = 14;
  string edited_at = 15;
  string created_at = 16;
  repeated string mention_user_ids = 17;
  repeated ChatReactionCount reactions = 18;
  ChatForwardedReference forwarded_from = 19;
}

// === Guild Events (all guilds, auto-detect) ===

message StreamGuildEventsRequest {}

message GuildEvent {
  GuildEventType event = 1;
  string guild_id = 2;
  string user_id = 3;
  string channel_id = 4;
  string name = 5;
  int64 type = 6;
  google.protobuf.Timestamp timestamp = 7;
  // Channel-specific fields (CHANNEL_CREATE/UPDATE).
  string topic = 8;
  int32 position = 9;
  string parent_id = 10;
  // Guild icon URL on "update" icon change.
  string icon_url = 11;
  // Role id on role_* events.
  string role_id = 12;
  // Reason on member_ban.
  string reason = 13;
  // Set by publishGuildEvent; mirrors `event`.
  GuildEventType action = 14;
}

// === Voice State (all guilds, auto-detect) ===

message StreamVoiceStateRequest {}

message VoiceStateEvent {
  VoiceEvent event = 1;
  string guild_id = 2;
  string channel_id = 3;
  string user_id = 4;
  bool self_mute = 5;
  bool self_deaf = 6;
  bool video = 7;
  bool streaming = 8;
  google.protobuf.Timestamp timestamp = 9;
  VoiceAction action = 10;
  // LiveKit participant SID.
  string sid = 11;
  // Display name from LiveKit participant.
  string name = 12;
  // Participant metadata JSON: {"userId","username","avatarUrl"}.
  string metadata = 13;
  VoiceTrackType track_type = 14;
  // On track_update: true = published, false = unpublished.
  bool published = 15;
  // Unix timestamp (seconds) when the LiveKit room for this channel
  // became active. Same value for every participant in the same channel.
  int64 room_active_since = 16;
}

// === Typing (all channels, auto-detect) ===

message StreamTypingRequest {}

message TypingEvent {
  string channel_id = 1;
  string guild_id = 2;
  string user_id = 3;
  google.protobuf.Timestamp timestamp = 4;
}

// === Friend Activity ===

message StreamFriendActivityRequest {}

message FriendActivityEvent {
  FriendEventType event = 1;
  string user_id = 2;
  // Full unique handle in "name#1234" format.
  string username = 3;
  PresenceStatus status = 4;
  string custom_status = 5;
  string avatar_url = 6;
  google.protobuf.Timestamp timestamp = 7;
  // For friend_accepted: the auto-opened DM channel id so both ends can
  // jump straight into conversation.
  string channel_id = 8;
  // Freely changeable display name shown in UI.
  string display_name = 9;
}
