syntax = "proto3";

package stream.v1;

option go_package = "github.com/ananddub/ndiscord_backend/gen/stream/v1;streamv1";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

enum ChatEventType {
  CHAT_EVENT_UNSPECIFIED = 0;
  CHAT_EVENT_CREATE = 1;
  CHAT_EVENT_UPDATE = 2;
  CHAT_EVENT_DELETE = 3;
  CHAT_EVENT_PIN = 4;
  CHAT_EVENT_UNPIN = 5;
  CHAT_EVENT_REACTION_ADD = 6;
  CHAT_EVENT_REACTION_REMOVE = 7;
  CHAT_EVENT_READ_RECEIPT = 8;
}

enum ChannelLifecycleType {
  CHANNEL_LIFECYCLE_UNSPECIFIED = 0;
  CHANNEL_LIFECYCLE_CREATE = 1;
  CHANNEL_LIFECYCLE_UPDATE = 2;
  CHANNEL_LIFECYCLE_DELETE = 3;
}

enum DmCallType {
  DM_CALL_UNSPECIFIED = 0;
  DM_CALL_INCOMING = 1;
  DM_CALL_ACCEPTED = 2;
  DM_CALL_REJECTED = 3;
  DM_CALL_ENDED = 4;
  DM_CALL_PARTICIPANT_LEFT = 5;
}

enum VoiceEvent {
  VOICE_EVENT_UNSPECIFIED = 0;
  VOICE_EVENT_STATE_UPDATE = 1;
}

enum VoiceAction {
  VOICE_ACTION_UNSPECIFIED = 0;
  VOICE_ACTION_JOIN = 1;
  VOICE_ACTION_LEAVE = 2;
  VOICE_ACTION_PARTICIPANT_JOINED = 3;
  VOICE_ACTION_PARTICIPANT_LEFT = 4;
  VOICE_ACTION_TRACK_UPDATE = 5;
  VOICE_ACTION_STATE_SYNC = 6;
  VOICE_ACTION_STATE_UPDATE = 7;
  VOICE_ACTION_ROOM_STARTED = 8;
  VOICE_ACTION_ROOM_FINISHED = 9;
}

enum VoiceTrackType {
  VOICE_TRACK_UNSPECIFIED = 0;
  VOICE_TRACK_AUDIO = 1;
  VOICE_TRACK_VIDEO = 2;
  VOICE_TRACK_SCREEN_SHARE = 3;
}

enum FriendEventType {
  FRIEND_EVENT_UNSPECIFIED = 0;
  FRIEND_EVENT_PRESENCE_UPDATE = 1;
  FRIEND_EVENT_PROFILE_UPDATE = 2;
  FRIEND_EVENT_REQUEST = 3;
  FRIEND_EVENT_ACCEPTED = 4;
  FRIEND_EVENT_DECLINED = 5;
  FRIEND_EVENT_REMOVED = 6;
  FRIEND_EVENT_REQUEST_CANCELLED = 7;
}

enum PresenceStatus {
  PRESENCE_STATUS_UNSPECIFIED = 0;
  PRESENCE_STATUS_ONLINE = 1;
  PRESENCE_STATUS_IDLE = 2;
  PRESENCE_STATUS_DND = 3;
  PRESENCE_STATUS_OFFLINE = 4;
}

enum GuildEventType {
  GUILD_EVENT_UNSPECIFIED = 0;
  GUILD_EVENT_MEMBER_ADD = 1;
  GUILD_EVENT_MEMBER_REMOVE = 2;
  GUILD_EVENT_MEMBER_BAN = 3;
  GUILD_EVENT_MEMBER_UNBAN = 4;
  GUILD_EVENT_UPDATE = 5;
  GUILD_EVENT_DELETE = 6;
  GUILD_EVENT_ROLE_CREATE = 7;
  GUILD_EVENT_ROLE_UPDATE = 8;
  GUILD_EVENT_ROLE_DELETE = 9;
  GUILD_EVENT_ROLE_ASSIGN = 10;
  GUILD_EVENT_ROLE_REMOVE = 11;
  GUILD_EVENT_CHANNEL_CREATE = 12;
  GUILD_EVENT_CHANNEL_UPDATE = 13;
  GUILD_EVENT_CHANNEL_DELETE = 14;
}

// All streaming RPCs are exposed over HTTP as SSE (Server-Sent Events).
// grpc-gateway emits each streamed message as a newline-delimited JSON
// object over HTTP chunked transfer — compatible with SSE consumers when
// the gateway is wired with an SSE marshaler / `Accept: text/event-stream`
// response header at the mux layer. All request types are empty (subscriber
// identity comes from the bearer token), so GET is the correct verb.
//
// URL convention: `/v1/stream/*` — subscription endpoints live under a
// single namespace so the frontend can multiplex them through one EventSource
// per topic.
service StreamService {
  rpc StreamDmChat(StreamDmChatRequest) returns (stream DmChatEvent) {
    option (google.api.http) = { get: "/v1/stream/dm/chat" };
  }

  rpc StreamDmChannels(StreamDmChannelsRequest) returns (stream DmChannelEvent) {
    option (google.api.http) = { get: "/v1/stream/dm/channels" };
  }

  rpc StreamDmCalls(StreamDmCallsRequest) returns (stream DmCallEvent) {
    option (google.api.http) = { get: "/v1/stream/dm/calls" };
  }

  rpc StreamTextChannels(StreamTextChannelsRequest) returns (stream TextChannelEvent) {
    option (google.api.http) = { get: "/v1/stream/channels/text" };
  }

  rpc StreamVoiceChat(StreamVoiceChatRequest) returns (stream VoiceChatEvent) {
    option (google.api.http) = { get: "/v1/stream/channels/voice-chat" };
  }

  rpc StreamGuildEvents(StreamGuildEventsRequest) returns (stream GuildEvent) {
    option (google.api.http) = { get: "/v1/stream/guilds" };
  }

  rpc StreamVoiceState(StreamVoiceStateRequest) returns (stream VoiceStateEvent) {
    option (google.api.http) = { get: "/v1/stream/voice-state" };
  }

  rpc StreamTyping(StreamTypingRequest) returns (stream TypingEvent) {
    option (google.api.http) = { get: "/v1/stream/typing" };
  }

  rpc StreamFriendActivity(StreamFriendActivityRequest) returns (stream FriendActivityEvent) {
    option (google.api.http) = { get: "/v1/stream/friends" };
  }
}

message ChatAttachment {
  string id = 1;
  string filename = 2;
  string url = 3;
  string content_type = 4;
  int64 size = 5;
}

message ChatReactionCount {
  string emoji = 1;
  int32 count = 2;
  bool me = 3;
}


message ChatForwardedReference {
  string channel_id = 1;
  string message_id = 2;
  string author_id = 3;
}


message StreamDmChatRequest {}

message DmChatEvent {
  ChatEventType type = 1;
  string channel_id = 2;
  string message_id = 3;
  string sender_id = 4;
  string author_id = 10;
  string content = 5;
  google.protobuf.Timestamp timestamp = 6;
  string reply_to_id = 7;
  repeated ChatAttachment attachments = 8;
  int32 msg_type = 9;
  bool pinned = 11;
  bool deleted = 12;
  string emoji = 13;
  string edited_at = 14;
  string created_at = 15;
  repeated string mention_user_ids = 16;
  repeated ChatReactionCount reactions = 17;
  ChatForwardedReference forwarded_from = 18;
}


message StreamDmChannelsRequest {}

message DmChannelMember {
  string id = 1;
  string username = 2;      
  string display_name = 3;
  string avatar_url = 4;
  string status = 5;
}

message DmChannelEvent {
  ChannelLifecycleType type = 1;
  string id = 2;           
  string name = 3;
  int32 channel_type = 4;   
  repeated DmChannelMember members = 5;
}


message StreamDmCallsRequest {}

message DmCallEvent {
  DmCallType type = 1;
  string channel_id = 2;
  string caller_id = 3;
  string participant_id = 4;
  bool video = 5;
  google.protobuf.Timestamp timestamp = 6;
}


message StreamTextChannelsRequest {}

message TextChannelEvent {
  ChatEventType type = 1;
  string guild_id = 2;
  string channel_id = 3;
  string message_id = 4;
  string author_id = 5;
  string content = 6;
  google.protobuf.Timestamp timestamp = 7;
  string sender_id = 8;
  string reply_to_id = 9;
  repeated ChatAttachment attachments = 10;
  int32 msg_type = 11;
  bool pinned = 12;
  bool deleted = 13;
  string emoji = 14;
  string edited_at = 15;
  string created_at = 16;
  repeated string mention_user_ids = 17;
  repeated ChatReactionCount reactions = 18;
  ChatForwardedReference forwarded_from = 19;
}


message StreamVoiceChatRequest {}

message VoiceChatEvent {
  ChatEventType type = 1;
  string guild_id = 2;
  string channel_id = 3;
  string message_id = 4;
  string author_id = 5;
  string content = 6;
  google.protobuf.Timestamp timestamp = 7;
  string sender_id = 8;
  string reply_to_id = 9;
  repeated ChatAttachment attachments = 10;
  int32 msg_type = 11;
  bool pinned = 12;
  bool deleted = 13;
  string emoji = 14;
  string edited_at = 15;
  string created_at = 16;
  repeated string mention_user_ids = 17;
  repeated ChatReactionCount reactions = 18;
  ChatForwardedReference forwarded_from = 19;
}


message StreamGuildEventsRequest {}

message GuildEvent {
  GuildEventType event = 1;
  string guild_id = 2;
  string user_id = 3;
  string channel_id = 4;
  string name = 5;
  int64 type = 6;
  google.protobuf.Timestamp timestamp = 7;
  string topic = 8;
  int32 position = 9;
  string parent_id = 10;
  string icon_url = 11;
  string role_id = 12;
  // Guild banner URL on "update" banner change.
  string banner_url = 15;
  string reason = 13;
  GuildEventType action = 14;

  // Role snapshot — populated on ROLE_CREATE, ROLE_UPDATE, ROLE_DELETE,
  // and on the ROLE_UPDATE events emitted by GrantRolePermission /
  // RevokeRolePermission. Carrying the full role state in the event
  // lets clients refresh their cache atomically without a follow-up
  // ListRolePermissions round trip.
  string role_name     = 16;
  string role_color    = 17;
  int32  role_position = 18;
  repeated string role_permissions = 19;
}


message StreamVoiceStateRequest {}

message VoiceStateEvent {
  VoiceEvent event = 1;
  string guild_id = 2;
  string channel_id = 3;
  string user_id = 4;
  bool self_mute = 5;
  bool self_deaf = 6;
  bool video = 7;
  bool streaming = 8;
  google.protobuf.Timestamp timestamp = 9;
  VoiceAction action = 10;
  string sid = 11;
  string name = 12;
  string metadata = 13;
  VoiceTrackType track_type = 14;
  bool published = 15;
  int64 room_active_since = 16;
}


message StreamTypingRequest {}

message TypingEvent {
  string channel_id = 1;
  string guild_id = 2;
  string user_id = 3;
  string username = 4;
  google.protobuf.Timestamp timestamp = 5;
}


message StreamFriendActivityRequest {}

message FriendActivityEvent {
  FriendEventType event = 1;
  string user_id = 2;
  string username = 3;
  PresenceStatus status = 4;
  string custom_status = 5;
  string avatar_url = 6;
  google.protobuf.Timestamp timestamp = 7;
  string channel_id = 8;
  string display_name = 9;
}
