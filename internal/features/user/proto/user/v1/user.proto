syntax = "proto3";

package user.v1;

option go_package = "github.com/ananddub/ndiscord_backend/gen/user/v1;userv1";

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc UpdateStatus(UpdateStatusRequest) returns (UpdateStatusResponse);
  rpc UploadUserAvatar(UploadUserAvatarRequest) returns (UploadUserAvatarResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc GetUserByUsername(GetUserByUsernameRequest) returns (GetUserByUsernameResponse);
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);

  // Friends
  rpc SendFriendRequest(SendFriendRequestRequest) returns (SendFriendRequestResponse);
  rpc AcceptFriendRequest(AcceptFriendRequestRequest) returns (AcceptFriendRequestResponse);
  rpc DeclineFriendRequest(DeclineFriendRequestRequest) returns (DeclineFriendRequestResponse);
  // CancelFriendRequest is called by the sender to withdraw their own
  // outgoing pending request before the recipient has acted on it.
  rpc CancelFriendRequest(CancelFriendRequestRequest) returns (CancelFriendRequestResponse);
  rpc RemoveFriend(RemoveFriendRequest) returns (RemoveFriendResponse);
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse);
  rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse);
  rpc ListFriends(ListFriendsRequest) returns (ListFriendsResponse);
  rpc ListPendingRequests(ListPendingRequestsRequest) returns (ListPendingRequestsResponse);
  rpc ListBlocked(ListBlockedRequest) returns (ListBlockedResponse);

}

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string avatar_url = 4;
  string bio = 5;
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // Hex color (e.g. "#5865F2") used as the profile/card background.
  string background_color = 9;
}

message GetUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  optional string username = 1 [(buf.validate.field).string = {min_len: 2, max_len: 32}];
  optional string avatar_url = 2 [(buf.validate.field).string = {max_len: 2048}];
  optional string bio = 3 [(buf.validate.field).string = {max_len: 500}];
  optional string status = 4 [(buf.validate.field).string = {max_len: 128}];
  // Hex color like "#5865F2". Must be 4 or 7 chars starting with '#'.
  optional string background_color = 5 [(buf.validate.field).string = {pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"}];
}

message UpdateUserResponse {
  User user = 1;
}

message UpdateStatusRequest {
  string status = 1 [(buf.validate.field).string = {max_len: 128}];
}

message UpdateStatusResponse {
  User user = 1;
}

message UploadUserAvatarRequest {
  string filename = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  string content_type = 2 [(buf.validate.field).string = {in: ["image/jpeg", "image/png", "image/gif", "image/webp"]}];
  bytes data = 3 [(buf.validate.field).bytes = {min_len: 1, max_len: 5242880}];
}

message UploadUserAvatarResponse {
  string avatar_url = 1;
  User user = 2;
}

message DeleteUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteUserResponse {}

message GetUserByUsernameRequest {
  string username = 1 [(buf.validate.field).string = {min_len: 2, max_len: 32}];
}

message GetUserByUsernameResponse {
  User user = 1;
}

message SearchUsersRequest {
  string query = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  int32 limit = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
}

message SearchUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}

// Friends

enum FriendshipStatus {
  FRIENDSHIP_STATUS_UNSPECIFIED = 0;
  FRIENDSHIP_STATUS_PENDING = 1;
  FRIENDSHIP_STATUS_ACCEPTED = 2;
  FRIENDSHIP_STATUS_BLOCKED = 3;
}

message Friendship {
  string user_id = 1;
  string friend_id = 2;
  FriendshipStatus status = 3;
  google.protobuf.Timestamp created_at = 4;
}

message SendFriendRequestRequest {
  string target_user_id = 1 [(buf.validate.field).string.uuid = true];
}

message SendFriendRequestResponse {
  Friendship friendship = 1;
}

message AcceptFriendRequestRequest {
  string requester_user_id = 1 [(buf.validate.field).string.uuid = true];
}

message AcceptFriendRequestResponse {
  Friendship friendship = 1;
}

message DeclineFriendRequestRequest {
  string requester_user_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeclineFriendRequestResponse {}

message CancelFriendRequestRequest {
  // The user the pending request was sent to.
  string target_user_id = 1 [(buf.validate.field).string.uuid = true];
}

message CancelFriendRequestResponse {}

message RemoveFriendRequest {
  string friend_id = 1 [(buf.validate.field).string.uuid = true];
}

message RemoveFriendResponse {}

message BlockUserRequest {
  string target_user_id = 1 [(buf.validate.field).string.uuid = true];
}

message BlockUserResponse {}

message UnblockUserRequest {
  string target_user_id = 1 [(buf.validate.field).string.uuid = true];
}

message UnblockUserResponse {}

message ListFriendsRequest {}

message ListFriendsResponse {
  repeated User friends = 1;
}

message ListPendingRequestsRequest {}

message ListPendingRequestsResponse {
  repeated Friendship incoming = 1;
  repeated Friendship outgoing = 2;
}

message ListBlockedRequest {}

message ListBlockedResponse {
  repeated User blocked = 1;
}

