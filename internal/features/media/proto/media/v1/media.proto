syntax = "proto3";

package media.v1;

option go_package = "github.com/ananddub/ndiscord_backend/gen/media/v1;mediav1";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "buf/validate/validate.proto";

// Two-phase upload: client POSTs metadata to get a presigned URL, uploads
// bytes directly to object storage, then POSTs back to confirm. Reads and
// deletes are keyed by the opaque file_id.
service MediaService {
  rpc RequestUpload(RequestUploadRequest) returns (RequestUploadResponse) {
    option (google.api.http) = { post: "/v1/media/uploads" body: "*" };
  }
  rpc ConfirmUpload(ConfirmUploadRequest) returns (ConfirmUploadResponse) {
    option (google.api.http) = { post: "/v1/media/uploads/{upload_id}/confirm" body: "*" };
  }
  rpc GetDownloadURL(GetDownloadURLRequest) returns (GetDownloadURLResponse) {
    option (google.api.http) = { get: "/v1/media/files/{file_id}/download" };
  }
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse) {
    option (google.api.http) = { delete: "/v1/media/files/{file_id}" };
  }
}

message RequestUploadRequest {
  string filename = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  string content_type = 2 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  int64 size = 3 [(buf.validate.field).int64 = {gt: 0, lte: 26214400}];
}

message RequestUploadResponse {
  string upload_id = 1;
  string upload_url = 2;
}

message ConfirmUploadRequest {
  string upload_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message ConfirmUploadResponse {
  string file_id = 1;
  string url = 2;
}

message GetDownloadURLRequest {
  string file_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message GetDownloadURLResponse {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message DeleteFileRequest {
  string file_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message DeleteFileResponse {}
