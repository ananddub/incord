syntax = "proto3";

package presence.v1;

option go_package = "github.com/ananddub/ndiscord_backend/gen/presence/v1;presencev1";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "buf/validate/validate.proto";

// URL conventions:
//   PATCH /v1/users/me/presence          self-update (online/idle/dnd/offline)
//   GET   /v1/users/{user_id}/presence   single-user read
//   GET   /v1/presence?user_ids=...      bulk read (comma-joined via repeated proxy)
service PresenceService {
  rpc UpdatePresence(UpdatePresenceRequest) returns (UpdatePresenceResponse) {
    option (google.api.http) = { patch: "/v1/users/me/presence" body: "*" };
  }
  rpc GetPresence(GetPresenceRequest) returns (GetPresenceResponse) {
    option (google.api.http) = { get: "/v1/users/{user_id}/presence" };
  }
  // Bulk reader takes user_ids as repeated query params (?user_ids=a&user_ids=b).
  // Kept GET even with a list because the operation is a pure fan-out read.
  rpc GetBulkPresence(GetBulkPresenceRequest) returns (GetBulkPresenceResponse) {
    option (google.api.http) = { get: "/v1/presence" };
  }
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ONLINE = 1;
  STATUS_IDLE = 2;
  STATUS_DND = 3;
  STATUS_OFFLINE = 4;
}

message Presence {
  string user_id = 1;
  Status status = 2;
  string custom_status = 3;
  google.protobuf.Timestamp last_seen = 4;
}

message UpdatePresenceRequest {
  Status status = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string custom_status = 2 [(buf.validate.field).string = {max_len: 128}];
}

message UpdatePresenceResponse {
  Presence presence = 1;
}

message GetPresenceRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetPresenceResponse {
  Presence presence = 1;
}

message GetBulkPresenceRequest {
  repeated string user_ids = 1 [(buf.validate.field).repeated = {min_items: 1, max_items: 500, items: {string: {uuid: true}}}];
}

message GetBulkPresenceResponse {
  repeated Presence presences = 1;
}
