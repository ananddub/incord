syntax = "proto3";

package auth.v1;

option go_package = "github.com/ananddub/ndiscord_backend/gen/auth/v1;authv1";

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc VerifyOTP(VerifyOTPRequest) returns (VerifyOTPResponse);
  rpc ResendOTP(ResendOTPRequest) returns (ResendOTPResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}

message RegisterRequest {
  string username = 1 [(buf.validate.field).string = {min_len: 2, max_len: 32}];
  string email = 2 [(buf.validate.field).string = {email: true, max_len: 255}];
  string password = 3 [(buf.validate.field).string = {min_len: 6, max_len: 128}];
}

message RegisterResponse {
  string user_id = 1;
  string message = 2;
}

message VerifyOTPRequest {
  string email = 1 [(buf.validate.field).string = {email: true, max_len: 255}];
  string otp = 2 [(buf.validate.field).string = {min_len: 4, max_len: 10, pattern: "^[0-9]+$"}];
}

message VerifyOTPResponse {
  string user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message ResendOTPRequest {
  string email = 1 [(buf.validate.field).string = {email: true, max_len: 255}];
}

message ResendOTPResponse {
  string message = 1;
}

message LoginRequest {
  string email = 1 [(buf.validate.field).string = {email: true, max_len: 255}];
  string password = 2 [(buf.validate.field).string = {min_len: 6, max_len: 128}];
}

message LoginResponse {
  string user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message LogoutRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message LogoutResponse {}

message ValidateTokenRequest {
  string access_token = 1 [(buf.validate.field).string.min_len = 1];
}

message ValidateTokenResponse {
  string user_id = 1;
  bool valid = 2;
}
