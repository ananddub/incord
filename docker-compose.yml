services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ndiscord-server
    command: ["-c", ".air.toml"]
    ports:
      - "50051:50051"
      - "9100:9100"
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    environment:
      HOST: "0.0.0.0"
      GRPC_PORT: "50051"
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_USER: ndiscord
      DB_PASSWORD: ndiscord
      DB_NAME: ndiscord
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      SCYLLA_HOST: scylladb:9042
      SCYLLA_KEYSPACE: ndiscord
      REDPANDA_BROKER: redpanda:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ndiscord
      MINIO_SECRET_KEY: ndiscord123
      MINIO_BUCKET: ndiscord
      MINIO_USE_SSL: "false"
      OPENFGA_API_URL: http://openfga:8080
      JWT_SECRET: dev-secret-change-in-production
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@ndiscord.local
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      scylladb:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./internal
          target: /app/internal
        - action: sync
          path: ./cmd
          target: /app/cmd
        - action: sync
          path: ./gen
          target: /app/gen
        - action: rebuild
          path: ./go.mod

  voice:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ndiscord-voice
    command: ["-c", ".air.voice.toml"]
    ports:
      - "50052:50052/udp"
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    environment:
      VOICE_UDP_HOST: "0.0.0.0"
      VOICE_UDP_PORT: "50052"
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./internal
          target: /app/internal
        - action: sync
          path: ./cmd
          target: /app/cmd
        - action: rebuild
          path: ./go.mod

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ndiscord-timescaledb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ndiscord
      POSTGRES_PASSWORD: ndiscord
      POSTGRES_DB: ndiscord
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndiscord"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ndiscord-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  scylladb:
    image: scylladb/scylla:latest
    container_name: ndiscord-scylladb
    ports:
      - "9042:9042"
      - "9160:9160"
    volumes:
      - scylla_data:/var/lib/scylla
    command: --smp 1 --memory 512M --overprovisioned 1
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 10s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: ndiscord-redpanda
    ports:
      - "9092:9092"
      - "8081:8081"
      - "8082:8082"
      - "9644:9644"
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 512M
      - --mode dev-container
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  redpanda-console:
    image: redpandadata/console:latest
    container_name: ndiscord-redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    depends_on:
      - redpanda

  minio:
    image: minio/minio:latest
    container_name: ndiscord-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ndiscord
      MINIO_ROOT_PASSWORD: ndiscord123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  openfga:
    image: openfga/openfga:latest
    container_name: ndiscord-openfga
    ports:
      - "8090:8080"
      - "8091:8081"
      - "3000:3000"
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://ndiscord:ndiscord@timescaledb:5432/ndiscord?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "true"
    depends_on:
      timescaledb:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: ndiscord-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    container_name: ndiscord-prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  mailpit:
    image: axllent/mailpit:latest
    container_name: ndiscord-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  timescaledb_data:
  redis_data:
  scylla_data:
  redpanda_data:
  minio_data:
  grafana_data:
  prometheus_data:
  go_mod_cache:
  go_build_cache:
