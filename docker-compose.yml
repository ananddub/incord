services:
  # Auto-init: PG migrations + ScyllaDB tables + OpenFGA setup (Go binary)
  init:
    build:
      context: .
      dockerfile: Dockerfile.init
    container_name: ndiscord-init
    environment:
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_USER: ndiscord
      DB_PASSWORD: ndiscord
      DB_NAME: ndiscord
      DB_SSLMODE: disable
      SCYLLA_HOST: scylladb:9042
      SCYLLA_KEYSPACE: ndiscord
      OPENFGA_API_URL: http://openfga:8080
    depends_on:
      timescaledb:
        condition: service_healthy
      scylladb:
        condition: service_healthy
      openfga:
        condition: service_started
    restart: "no"

  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ndiscord-server
    command: ["-c", ".air.toml"]
    ports:
      - "50051:50051"
      - "9100:9100"
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    environment:
      HOST: "0.0.0.0"
      GRPC_PORT: "50051"
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_USER: ndiscord
      DB_PASSWORD: ndiscord
      DB_NAME: ndiscord
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      SCYLLA_HOST: scylladb:9042
      SCYLLA_KEYSPACE: ndiscord
      MINIO_ENDPOINT: rustfs:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-192.168.1.2:9000}
      MINIO_ACCESS_KEY: ndiscord
      MINIO_SECRET_KEY: ndiscord123
      MINIO_BUCKET: ndiscord
      MINIO_USE_SSL: "false"
      OPENFGA_API_URL: http://openfga:8080
      JWT_SECRET: dev-secret-change-in-production
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@ndiscord.local
      NATS_URL: nats://nats:4222
      INVITE_BASE_URL: ${INVITE_BASE_URL:-https://ndiscord.app/invite}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://192.168.1.2:7880}
      LIVEKIT_HTTP_URL: http://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      scylladb:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./internal
          target: /app/internal
        - action: sync
          path: ./cmd
          target: /app/cmd
        - action: sync
          path: ./gen
          target: /app/gen
        - action: rebuild
          path: ./go.mod

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ndiscord-timescaledb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ndiscord
      POSTGRES_PASSWORD: ndiscord
      POSTGRES_DB: ndiscord
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndiscord"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ndiscord-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  scylladb:
    image: scylladb/scylla:latest
    container_name: ndiscord-scylladb
    ports:
      - "9042:9042"
      - "9160:9160"
    volumes:
      - scylla_data:/var/lib/scylla
    command: --smp 1 --memory 512M --overprovisioned 1
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 10s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: ndiscord-rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ndiscord
      RUSTFS_SECRET_KEY: ndiscord123
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    command: server --console-enable --address :9000 --console-address :9001 /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  openfga:
    image: openfga/openfga:latest
    container_name: ndiscord-openfga
    ports:
      - "8090:8080"
      - "8091:8081"
      - "3000:3000"
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://ndiscord:ndiscord@timescaledb:5432/ndiscord?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "true"
    depends_on:
      timescaledb:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: ndiscord-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    container_name: ndiscord-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:latest
    container_name: ndiscord-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_data:/tmp
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: ndiscord-prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  nats:
    image: nats:latest
    container_name: ndiscord-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  nui:
    image: ghcr.io/nats-nui/nui:latest
    container_name: ndiscord-nui
    ports:
      - "31311:31311"
    volumes:
      - nui_data:/db
    depends_on:
      nats:
        condition: service_started
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    container_name: ndiscord-livekit
    command: ["--config", "/etc/livekit.yaml", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880"        # WebSocket signaling
      - "7881:7881"        # RTC / TURN-TCP
      - "50100-50150:50100-50150/udp"  # RTC media (narrow range for dev)
      # 6789 (prometheus) is only scraped from inside the docker network.
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: ndiscord-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  timescaledb_data:
  redis_data:
  scylla_data:
  rustfs_data:
  grafana_data:
  prometheus_data:
  loki_data:
  promtail_data:
  nui_data:
  go_mod_cache:
  go_build_cache:
