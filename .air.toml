root = "."
tmp_dir = "tmp"

[build]
  pre_cmd = ["go mod download"]
  cmd = "go build -o ./tmp/server ./cmd/server"
  full_bin = "./tmp/server"
  bin = "./tmp/server"
  delay = 1000
  exclude_dir = ["tmp", "gen", "db", "vendor", "node_modules"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "toml", "yaml"]
  kill_delay = "1s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
